services:
  - type: web
    env: static
    name: academiahelper
    buildCommand: npm install && npm run build
    staticSite:
      source: dist
      routes:
        - path: /*
          destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Robots-Tag
        value: all